<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIO Chain — Supported Chains & Networks</title>
  <meta name="description" content="All 30+ blockchain networks supported by AIO Chain. EVM, Solana, Bitcoin, Tron, Sui, Aptos, Cosmos, TON, Starknet.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

  <nav class="nav" id="main-nav"></nav>

  <section class="hero hero--compact" id="hero">
    <div class="hero-bg"></div>
    <div style="position:relative;z-index:1;text-align:center">
      <h1>Supported Chains</h1>
      <p>9 ecosystems · <span id="total-nets">30+</span> networks · click a row to see details</p>
    </div>
  </section>

  <section class="chains-section">
    <div class="ct-wrap">
      <table class="ct-table">
        <thead>
          <tr>
            <th class="ct-th-rank">#</th>
            <th class="ct-th-chain">Chain</th>
            <th>Curve</th>
            <th>Encoding</th>
            <th>Addr Length</th>
            <th>Derivation</th>
            <th>BIP39</th>
          </tr>
        </thead>
        <tbody id="chains-tbody"></tbody>
      </table>
    </div>
  </section>

  <footer class="footer">
    <p>All wallets are generated client-side. Private keys never leave your browser.</p>
    <p style="margin-top:8px;font-size:11px;color:var(--gray-400)">© 2026 xinnxz. All rights reserved. Licensed under MIT.</p>
  </footer>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="i18n.js"></script>
  <script src="nav.js"></script>
  <script src="interactions.js"></script>
  <script src="chains.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
  </script>
</body>
</html>
