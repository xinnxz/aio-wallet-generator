<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIO Chain — Format Converter</title>
  <meta name="description" content="Convert between Hex, Base58, Bech32, EVM checksum, and derive keys from mnemonic — all client-side.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="main-nav"></nav>

  <!-- HERO -->
  <section class="hero hero--compact" id="hero">
    <div class="hero-bg"></div>
    <div style="position:relative;z-index:1;text-align:center">
      <h1>Format Converter</h1>
      <p>Convert between Hex, Base58, checksum formats, and derive keys from mnemonic.</p>
    </div>
  </section>

  <!-- CONVERTER -->
  <section class="converter-section">
    <div class="converter-inner">

      <!-- Tool 1: Hex ↔ Base58 -->
      <div class="converter-card">
        <div class="converter-card-header">
          <i class="hgi-stroke hgi-exchange-01"></i>
          <h3>Hex ↔ Base58</h3>
        </div>
        <div class="converter-row">
          <div class="converter-field">
            <label class="converter-label">Hex</label>
            <input type="text" class="input mono" id="hex-input" placeholder="0a1b2c3d4e5f..." autocomplete="off" spellcheck="false">
          </div>
          <div class="converter-swap">
            <button class="swap-btn" id="swap-hex-b58" title="Swap">
              <i class="hgi-stroke hgi-arrow-data-transfer-vertical"></i>
            </button>
          </div>
          <div class="converter-field">
            <label class="converter-label">Base58</label>
            <input type="text" class="input mono" id="b58-input" placeholder="5Kd3Nbu..." autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="converter-actions">
          <button class="btn-convert" id="hex-to-b58"><i class="hgi-stroke hgi-arrow-down-01"></i> Hex → Base58</button>
          <button class="btn-convert" id="b58-to-hex"><i class="hgi-stroke hgi-arrow-up-01"></i> Base58 → Hex</button>
        </div>
      </div>

      <!-- Tool 2: EVM Checksum -->
      <div class="converter-card">
        <div class="converter-card-header">
          <i class="hgi-stroke hgi-checkmark-circle-02"></i>
          <h3>EVM Checksum (EIP-55)</h3>
        </div>
        <div class="converter-field">
          <label class="converter-label">EVM Address (lowercase or mixed)</label>
          <input type="text" class="input mono" id="checksum-input" placeholder="0xd8da6bf26964af9d7eed9e03e53415d37aa96045" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn-convert" id="checksum-btn" style="margin-top:12px">
          <i class="hgi-stroke hgi-checkmark-circle-02"></i> Convert to Checksummed
        </button>
        <div class="converter-output" id="checksum-result" style="display:none"></div>
      </div>

      <!-- Tool 3: Mnemonic → Keys -->
      <div class="converter-card">
        <div class="converter-card-header">
          <i class="hgi-stroke hgi-key-01"></i>
          <h3>Mnemonic → Keys</h3>
        </div>
        <div class="converter-field">
          <label class="converter-label">BIP39 Mnemonic <span class="converter-hint">(12 or 24 words)</span></label>
          <textarea class="input mono" id="mnemonic-input" rows="2" placeholder="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" spellcheck="false"></textarea>
        </div>
        <button class="btn-convert" id="mnemonic-btn" style="margin-top:12px">
          <i class="hgi-stroke hgi-key-01"></i> Derive Keys
        </button>
        <div class="converter-output" id="seed-result" style="display:none"></div>
      </div>

      <!-- Tool 4: Text ↔ Hex -->
      <div class="converter-card">
        <div class="converter-card-header">
          <i class="hgi-stroke hgi-text-font"></i>
          <h3>Text ↔ Hex</h3>
        </div>
        <div class="converter-row">
          <div class="converter-field">
            <label class="converter-label">Text (UTF-8)</label>
            <input type="text" class="input" id="text-input" placeholder="Hello World" autocomplete="off">
          </div>
          <div class="converter-swap">
            <button class="swap-btn" id="swap-text-hex" title="Swap">
              <i class="hgi-stroke hgi-arrow-data-transfer-vertical"></i>
            </button>
          </div>
          <div class="converter-field">
            <label class="converter-label">Hex</label>
            <input type="text" class="input mono" id="text-hex-input" placeholder="48656c6c6f..." autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="converter-actions">
          <button class="btn-convert" id="text-to-hex"><i class="hgi-stroke hgi-arrow-down-01"></i> Text → Hex</button>
          <button class="btn-convert" id="hex-to-text"><i class="hgi-stroke hgi-arrow-up-01"></i> Hex → Text</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>All conversions are processed client-side. Nothing leaves your browser.</p>
  </footer>

  <!-- Toast -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="nav.js"></script>
  <script src="converter.js"></script>
</body>
</html>
