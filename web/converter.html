<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIO Chain — Format Converter</title>
  <meta name="description" content="Convert between Hex, Base58, Bech32, EVM checksum, and derive keys from mnemonic — all client-side.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="main-nav"></nav>

  <!-- HERO -->
  <section class="hero hero--compact" id="hero">
    <div class="hero-bg"></div>
    <div style="position:relative;z-index:1;text-align:center">
      <h1>Format Converter</h1>
      <p>Convert between Hex, Base58, checksum formats, and derive keys from mnemonic.</p>
    </div>
  </section>

  <!-- CONVERTER -->
  <section class="converter-section">
    <div class="converter-inner">

      <!-- Tool 1: Hex ↔ Base58 -->
      <div class="converter-card">
        <div class="converter-card-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <h3>Hex ↔ Base58</h3>
        </div>
        <div class="converter-row">
          <div class="converter-field">
            <label class="converter-label">Hex</label>
            <input type="text" class="input mono" id="hex-input" placeholder="0a1b2c3d4e5f..." autocomplete="off" spellcheck="false">
          </div>
          <div class="converter-swap">
            <button class="swap-btn" id="swap-hex-b58" title="Swap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/><line x1="5" y1="5" x2="19" y2="5"/></svg>
            </button>
          </div>
          <div class="converter-field">
            <label class="converter-label">Base58</label>
            <input type="text" class="input mono" id="b58-input" placeholder="5Kd3Nbu..." autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="converter-actions">
          <button class="btn-convert" id="hex-to-b58"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Hex → Base58</button>
          <button class="btn-convert" id="b58-to-hex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> Base58 → Hex</button>
        </div>
      </div>

      <!-- Tool 2: EVM Checksum -->
      <div class="converter-card">
        <div class="converter-card-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <h3>EVM Checksum (EIP-55)</h3>
        </div>
        <div class="converter-field">
          <label class="converter-label">EVM Address (lowercase or mixed)</label>
          <input type="text" class="input mono" id="checksum-input" placeholder="0xd8da6bf26964af9d7eed9e03e53415d37aa96045" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn-convert" id="checksum-btn" style="margin-top:12px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Convert to Checksummed
        </button>
        <div class="converter-output" id="checksum-result" style="display:none"></div>
      </div>

      <!-- Tool 3: Mnemonic → Keys -->
      <div class="converter-card">
        <div class="converter-card-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <h3>Mnemonic → Keys</h3>
        </div>
        <div class="converter-field">
          <label class="converter-label">BIP39 Mnemonic <span class="converter-hint">(12 or 24 words)</span></label>
          <textarea class="input mono" id="mnemonic-input" rows="2" placeholder="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" spellcheck="false"></textarea>
        </div>
        <button class="btn-convert" id="mnemonic-btn" style="margin-top:12px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> Derive Keys
        </button>
        <div class="converter-output" id="seed-result" style="display:none"></div>
      </div>

      <!-- Tool 4: Text ↔ Hex -->
      <div class="converter-card">
        <div class="converter-card-header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <h3>Text ↔ Hex</h3>
        </div>
        <div class="converter-row">
          <div class="converter-field">
            <label class="converter-label">Text (UTF-8)</label>
            <input type="text" class="input" id="text-input" placeholder="Hello World" autocomplete="off">
          </div>
          <div class="converter-swap">
            <button class="swap-btn" id="swap-text-hex" title="Swap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/><line x1="5" y1="5" x2="19" y2="5"/></svg>
            </button>
          </div>
          <div class="converter-field">
            <label class="converter-label">Hex</label>
            <input type="text" class="input mono" id="text-hex-input" placeholder="48656c6c6f..." autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="converter-actions">
          <button class="btn-convert" id="text-to-hex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Text → Hex</button>
          <button class="btn-convert" id="hex-to-text"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> Hex → Text</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>All conversions are processed client-side. Nothing leaves your browser.</p>
    <p style="margin-top:8px;font-size:11px;color:var(--gray-400)">© 2026 xinnxz. All rights reserved. Licensed under MIT.</p>
  </footer>

  <!-- Toast -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="nav.js"></script>
  <script src="interactions.js"></script>
  <script src="converter.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
  </script>
</body>
</html>
