<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIO Chain — Validate Wallet Addresses</title>
  <meta name="description" content="Validate cryptocurrency wallet addresses across 30+ chains. Auto-detect chain, checksum verification, batch validation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="icon" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="main-nav"></nav>

  <!-- HERO (compact for subpages) -->
  <section class="hero hero--compact" id="hero">
    <div class="hero-bg"></div>
    <div style="position:relative;z-index:1;text-align:center">
      <h1>Validate Wallet Addresses</h1>
      <p>Auto-detect chain, verify format & checksum, batch validate — 100% client-side.</p>
    </div>
  </section>

  <!-- VALIDATOR -->
  <section class="validator-section">
    <div class="validator-inner">

      <!-- Mode Toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="single">
          <i class="hgi-stroke hgi-cursor-01"></i> Single
        </button>
        <button class="mode-btn" data-mode="batch">
          <i class="hgi-stroke hgi-text-wrap"></i> Batch
        </button>
      </div>

      <!-- Single Mode -->
      <div class="validator-card" id="single-mode">
        <label class="validator-label">Wallet Address</label>
        <div class="validator-input-wrap">
          <input type="text" class="input validator-input" id="address-input"
                 placeholder="Paste any address (0x..., bc1..., T..., cosmos1...)"
                 autocomplete="off" spellcheck="false">
          <button class="paste-btn" id="paste-btn" title="Paste from clipboard">
            <i class="hgi-stroke hgi-clipboard-01"></i>
          </button>
        </div>
        <button class="btn-primary validator-submit" id="validate-btn">
          <i class="hgi-stroke hgi-checkmark-circle-02"></i> Validate
        </button>
      </div>

      <!-- Batch Mode -->
      <div class="validator-card" id="batch-mode" style="display:none">
        <label class="validator-label">
          Paste Multiple Addresses
          <span class="validator-hint">(one per line)</span>
        </label>
        <textarea class="input validator-textarea" id="batch-input" rows="8"
                  placeholder="0x4aE804a94d9c05Ae00bDeB50817499&#10;TJYkNPrr3B8vKbx2EWZH&#10;cosmos1qp8z6d6x9naf&#10;bc1qxy2kgdygjrsq"></textarea>
        <div class="validator-batch-actions">
          <span class="batch-count" id="batch-count">0 addresses</span>
          <button class="btn-primary validator-submit" id="batch-validate-btn">
            <i class="hgi-stroke hgi-checkmark-circle-02"></i> Validate All
          </button>
        </div>
      </div>

      <!-- Results -->
      <div class="validator-results" id="results" style="display:none">
        <div class="validator-results-header">
          <h3>Results</h3>
          <div class="validator-stats">
            <span class="vstat vstat--valid">
              <i class="hgi-stroke hgi-checkmark-circle-02"></i>
              <span id="count-valid">0</span> Valid
            </span>
            <span class="vstat vstat--invalid">
              <i class="hgi-stroke hgi-cancel-circle"></i>
              <span id="count-invalid">0</span> Invalid
            </span>
          </div>
        </div>
        <div class="validator-result-list" id="result-list"></div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>All validation is performed client-side. Nothing is sent to any server.</p>
  </footer>

  <!-- Toast -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="nav.js"></script>
  <script src="validator.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
  </script>
</body>
</html>
